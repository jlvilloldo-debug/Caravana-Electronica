<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Identificá animales con una foto y llevá su ficha productiva: pesadas, partos, sanidad, dieta y faena.">
<meta name="theme-color" content="#2E6A4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CARAVANA DIGITAL IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F3EE;--surface:#FFFFFF;--surface-2:#E7EAE1;--ink:#1D2420;--muted:#5C665E;--line:#D3D8CC;
  --green:#2E6A4B;--green-ink:#FFFFFF;--green-soft:#DCE9E0;
  --tag:#F2C230;--tag-ink:#2A2204;
  --ok:#2E7D4F;--ok-soft:#DDEFE3;--warn:#9A6212;--warn-soft:#F7E9CF;--crit:#B3392F;--crit-soft:#F6DEDA;--info:#2F5E8C;--info-soft:#DDE7F2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121614;--surface:#1A201C;--surface-2:#242B26;--ink:#E7EBE4;--muted:#9AA59C;--line:#313A34;
  --green:#62B489;--green-ink:#0C1A12;--green-soft:#1F3328;
  --tag:#E9B92A;--tag-ink:#231B02;
  --ok:#6CC592;--ok-soft:#1D3326;--warn:#E3AE55;--warn-soft:#3A2E17;--crit:#E7837A;--crit-soft:#3C2220;--info:#86AEDB;--info-soft:#1D2C3D;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614;--surface:#1A201C;--surface-2:#242B26;--ink:#E7EBE4;--muted:#9AA59C;--line:#313A34;
  --green:#62B489;--green-ink:#0C1A12;--green-soft:#1F3328;
  --tag:#E9B92A;--tag-ink:#231B02;
  --ok:#6CC592;--ok-soft:#1D3326;--warn:#E3AE55;--warn-soft:#3A2E17;--crit:#E7837A;--crit-soft:#3C2220;--info:#86AEDB;--info-soft:#1D2C3D;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.35rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.top .espwrap{padding-block:0 10px;display:block}
.espbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.espbar::-webkit-scrollbar{display:none}
.espbar button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.espbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.espbar .n{font-family:var(--mono);font-size:.75rem;opacity:.75}
.diet h4{font-family:var(--display);font-size:.95rem;margin:0}
.ration{width:100%;border-collapse:collapse;font-size:.9rem}
.ration th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.ration td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ration td.q{font-family:var(--mono);white-space:nowrap}
.tbl{overflow-x:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.85rem;cursor:pointer;background:var(--surface)}
.checks input{width:auto;margin:0;accent-color:var(--green)}
.checks label:has(input:checked){background:var(--green-soft);border-color:var(--green)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reqs div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.reqs span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.reqs b{font-family:var(--mono);font-size:.95rem}
ul.tight{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.brand-mark{width:30px;height:34px;background:var(--tag);border-radius:9px 9px 14px 14px;position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;top:6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--bg)}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--body);font-weight:400}
.spacer{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.78rem;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--green)}
.nav .badge{background:var(--crit);color:#fff;border-radius:99px;font-size:.68rem;padding:0 6px;margin-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;background:var(--tag);color:var(--tag-ink);border-radius:7px 7px 11px 11px;padding:6px 9px 4px;position:relative;font-size:.92rem;letter-spacing:.02em;white-space:nowrap}
.tag::before{content:"";position:absolute;top:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tag-ink);opacity:.35}
.tag.big{font-size:1.35rem;padding:12px 14px 8px;border-radius:10px 10px 18px 18px}
.tag.big::before{top:5px;width:6px;height:6px;margin-left:-3px}
.tag.none{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.mute{background:var(--surface-2);color:var(--muted)}
.chip.celo{background:var(--tag);color:var(--tag-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* capture */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.capture label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);font-weight:600;cursor:pointer;text-align:center;padding:12px}
.capture label:first-child{background:var(--green);color:var(--green-ink);border:0}
.capture svg{width:30px;height:30px}
.capture input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.preview img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:var(--surface-2)}
@media (max-width:460px){.preview{grid-template-columns:1fr}.preview img{width:100%;height:auto;max-height:260px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.match{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.match img,.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface-2);display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;width:70px}
.meter span{display:block;height:100%;background:var(--green)}
details.guide summary{cursor:pointer;font-weight:600}
details.guide ul{margin:.6em 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* rodeo */
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1 1 150px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .name{font-weight:600}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.summary b{display:block;font-family:var(--mono);font-size:1.25rem}
.summary span{font-size:.75rem;color:var(--muted)}
@media (max-width:460px){.summary{grid-template-columns:repeat(2,1fr)}}
/* ficha */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.hero .pic{width:150px;aspect-ratio:1;max-width:100%;border-radius:var(--r);object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (max-width:500px){.hero{grid-template-columns:1fr}.hero .pic{width:100%;aspect-ratio:4/3}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--mono);font-size:1.05rem}
.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.panels{grid-template-columns:1fr}}
.panel{border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--surface)}
.panel.s-ok{border-left:4px solid var(--ok)}.panel.s-warn{border-left:4px solid var(--warn)}.panel.s-crit{border-left:4px solid var(--crit)}.panel.s-info{border-left:4px solid var(--info)}.panel.s-celo{border-left:4px solid var(--tag)}.panel.s-mute{border-left:4px solid var(--line)}
.panel p{margin:.3em 0 0;font-size:.88rem}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--green)}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding-top:2px}
.ev .x{background:none;border:0;color:var(--muted);padding:2px 6px;border-radius:6px}
.ev .x:hover{color:var(--crit)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:4px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.gallery figcaption{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
/* form / sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:16px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid2 .full{grid-column:1/-1}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.75rem;color:var(--muted)}
.banner{border-radius:10px;padding:10px 12px;font-size:.88rem}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.alertbox{background:var(--crit-soft);color:var(--crit);border:2px solid var(--crit);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.alertbox h3{color:var(--crit)}
.alertbox ul li,.alertbox p{color:var(--ink)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:.9rem;background:var(--surface)}
.checklist input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green)}
.checklist label.imp:not(:has(input:checked)){border-color:var(--crit);background:var(--crit-soft)}
.checklist label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.checklist .req{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--crit);display:block}
.veredicto{border-radius:10px;padding:10px 12px;font-weight:600}
.veredicto.bad{background:var(--crit);color:var(--bg)}
.veredicto.good{background:var(--ok);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:30;max-width:90vw}
.alert-group{display:flex;flex-direction:column;gap:8px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ===== CARAVANA DIGITAL IA · módulo escuela ===== */
.nav .in{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:.72rem}
.top .qrbtn{display:inline-flex;align-items:center;gap:6px}
.top .qrbtn svg{width:18px;height:18px}
.badge{background:var(--crit);color:#fff;border-radius:99px;font-size:.68rem;padding:0 6px;margin-left:4px;font-weight:700}
.meter.big{width:100%;height:8px}
.meter span.ok{background:var(--ok)}.meter span.crit{background:var(--crit)}
.cmark{width:52px;height:52px;border-radius:10px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:.95rem;text-transform:uppercase;flex:none}
.item.corral{align-items:start}
.tareas{display:flex;flex-direction:column;gap:8px}
.tarea{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;width:100%}
.tarea.hecha{background:var(--surface)}
.tarea:disabled{opacity:.6}
.tico{width:52px;height:52px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--muted);flex:none}
.capfoto{display:flex;align-items:center;justify-content:center;min-height:150px;border:1.5px dashed var(--green);border-radius:var(--r);background:var(--green-soft);color:var(--green);font-weight:700;cursor:pointer;overflow:hidden;position:relative}
.capfoto input{position:absolute;width:1px;height:1px;opacity:0}
.capfoto img{width:100%;max-height:260px;object-fit:cover;display:block}
img.big{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--surface-2)}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.star{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;font-size:1rem;color:var(--warn)}
.star.on{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.estr{color:var(--warn);letter-spacing:1px;font-size:.9rem}
.crow{display:grid;grid-template-columns:110px 1fr 90px auto;gap:6px;align-items:center}
.crow .x,.item .x{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:6px}
.trow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center}
@media (max-width:460px){.crow{grid-template-columns:96px 1fr 70px auto}.trow{grid-template-columns:1fr 1fr}.trow b{grid-column:1/-1}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mbtn{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.mbtn b{font-family:var(--display);font-size:1rem}
.mbtn span{color:var(--muted);font-size:.84rem}
.mbtn:hover{border-color:var(--green)}
/* semáforo */
.lz{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.lz.ok{background:var(--ok)}.lz.warn{background:#E0A021}.lz.crit{background:var(--crit)}.lz.mute{background:var(--line)}
.luces{display:inline-flex;gap:4px;margin-top:5px}
.semaforo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sm{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.sm .lz{width:14px;height:14px;margin-top:2px}
.sm b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.sm span{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
.sm.crit{border-color:var(--crit);background:var(--crit-soft)}.sm.warn{border-color:#E0A021}
@media (max-width:760px){.semaforo{grid-template-columns:1fr 1fr}}
.spark{display:block;margin-top:4px}
/* gráficos */
.leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:4px}
.leyenda i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}
.leyenda i.dash{background:repeating-linear-gradient(90deg,var(--green) 0 4px,transparent 4px 7px);height:3px}
.leyenda i.ok{background:var(--ok)}.leyenda i.warn{background:#E0A021}.leyenda i.crit{background:var(--crit)}.leyenda i.mute{background:var(--line)}
.barras{display:flex;flex-direction:column;gap:6px}
.bf,.cob summary{display:grid;grid-template-columns:minmax(70px,130px) 1fr 72px;gap:8px;align-items:center;font-size:.84rem}
.cob summary{cursor:pointer;list-style:none}.cob summary::-webkit-details-marker{display:none}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bt{position:relative;height:14px;background:var(--surface-2);border-radius:5px}
.bb{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--info)}
.bb.ok{background:var(--ok)}.bb.warn{background:#E0A021}.bb.crit{background:var(--crit)}.bb.info{background:var(--info)}
.be{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bv{text-align:right}
.bf2{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;font-size:.84rem}
.apil{display:flex;height:18px;border-radius:5px;overflow:hidden;font-size:.7rem;font-weight:700;color:#fff}
.apil span{display:flex;align-items:center;justify-content:center;min-width:14px}
.apil .ok{background:var(--ok)}.apil .warn{background:#E0A021}.apil .crit{background:var(--crit)}.apil .mute{background:var(--line);color:var(--muted)}
.histo{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.hb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.hb span{width:100%;background:var(--green-soft);border:1px solid var(--green);border-radius:5px 5px 0 0;min-height:0}
.hb span.ok{background:var(--ok);border-color:var(--ok)}.hb span.info{background:var(--info-soft);border-color:var(--info)}.hb span.crit{background:var(--crit-soft);border-color:var(--crit)}
.hb small{font-size:.7rem;color:var(--muted);white-space:nowrap}
.vacs{display:flex;flex-direction:column;gap:6px}
.vac{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.vac.crit{border-color:var(--crit)}
/* QR */
.visor{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:1;max-height:60vh}
.visor video{width:100%;height:100%;object-fit:cover;display:block}
.mira{position:absolute;inset:18%;border:3px solid var(--tag);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.etiquetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.etq{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;border:1.5px solid var(--ink);border-radius:12px;padding:10px;background:#fff;color:#111;break-inside:avoid}
.etq .qr svg{width:110px;height:110px;display:block}
.etq b{display:block;font-family:var(--mono);font-size:1.25rem}
.etq span{display:block;font-size:.8rem}
.etq small{display:block;font-size:.66rem;color:#555;margin-top:4px}
.etq.solo{grid-template-columns:170px 1fr;text-align:left;max-width:380px}
.etq.solo .qr svg{width:170px;height:170px}
.imp-head{display:none}
.revision .row h3{margin:0}
.nov{align-items:start}
@media print{
  .top,.nav,.noprint,#toast{display:none!important}
  body{background:#fff!important;color:#000!important}
  .wrap{padding:0!important;max-width:none}
  .imp-head{display:block;margin-bottom:10px}
  .card{border:0;padding:0}
  .etiquetas{grid-template-columns:repeat(3,1fr);gap:6mm}
  .ration th,.ration td{border-bottom:1px solid #999}
  body.print-sheet main{display:none}
  body.print-sheet #sheet .sheet{position:static;background:none}
  body.print-sheet #sheet .box{box-shadow:none;max-height:none}
  body.print-sheet #sheet button{display:none}
  body:not(.print-sheet) #sheet{display:none}
}
.aviso-lic{background:var(--warn-soft);color:var(--warn);font-size:.82rem;padding:6px 16px;text-align:center}
.aviso-lic.crit{background:var(--crit);color:#fff}
.pie{text-align:center;font-size:.72rem;color:var(--muted);padding:18px 0 0}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--green);color:var(--green-ink);border-radius:99px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font-size:.88rem}
.upd button{background:var(--green-ink);color:var(--green);border:0;border-radius:99px;padding:6px 12px;font-weight:700}

.top h1{font-size:1.15rem;letter-spacing:.01em}
@media (max-width:520px){.top .brand small{display:none}.top h1{font-size:1.02rem}}

</style>
