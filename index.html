<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Identificá animales con una foto y llevá su ficha productiva: pesadas, partos, sanidad, dieta y faena.">
<meta name="theme-color" content="#2E6A4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caravana Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F3EE;--surface:#FFFFFF;--surface-2:#E7EAE1;--ink:#1D2420;--muted:#5C665E;--line:#D3D8CC;
  --green:#2E6A4B;--green-ink:#FFFFFF;--green-soft:#DCE9E0;
  --tag:#F2C230;--tag-ink:#2A2204;
  --ok:#2E7D4F;--ok-soft:#DDEFE3;--warn:#9A6212;--warn-soft:#F7E9CF;--crit:#B3392F;--crit-soft:#F6DEDA;--info:#2F5E8C;--info-soft:#DDE7F2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121614;--surface:#1A201C;--surface-2:#242B26;--ink:#E7EBE4;--muted:#9AA59C;--line:#313A34;
  --green:#62B489;--green-ink:#0C1A12;--green-soft:#1F3328;
  --tag:#E9B92A;--tag-ink:#231B02;
  --ok:#6CC592;--ok-soft:#1D3326;--warn:#E3AE55;--warn-soft:#3A2E17;--crit:#E7837A;--crit-soft:#3C2220;--info:#86AEDB;--info-soft:#1D2C3D;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614;--surface:#1A201C;--surface-2:#242B26;--ink:#E7EBE4;--muted:#9AA59C;--line:#313A34;
  --green:#62B489;--green-ink:#0C1A12;--green-soft:#1F3328;
  --tag:#E9B92A;--tag-ink:#231B02;
  --ok:#6CC592;--ok-soft:#1D3326;--warn:#E3AE55;--warn-soft:#3A2E17;--crit:#E7837A;--crit-soft:#3C2220;--info:#86AEDB;--info-soft:#1D2C3D;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.35rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.top .espwrap{padding-block:0 10px;display:block}
.espbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.espbar::-webkit-scrollbar{display:none}
.espbar button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.espbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.espbar .n{font-family:var(--mono);font-size:.75rem;opacity:.75}
.diet h4{font-family:var(--display);font-size:.95rem;margin:0}
.ration{width:100%;border-collapse:collapse;font-size:.9rem}
.ration th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.ration td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ration td.q{font-family:var(--mono);white-space:nowrap}
.tbl{overflow-x:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.85rem;cursor:pointer;background:var(--surface)}
.checks input{width:auto;margin:0;accent-color:var(--green)}
.checks label:has(input:checked){background:var(--green-soft);border-color:var(--green)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reqs div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.reqs span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.reqs b{font-family:var(--mono);font-size:.95rem}
ul.tight{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.brand-mark{width:30px;height:34px;background:var(--tag);border-radius:9px 9px 14px 14px;position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;top:6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--bg)}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--body);font-weight:400}
.spacer{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.78rem;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--green)}
.nav .badge{background:var(--crit);color:#fff;border-radius:99px;font-size:.68rem;padding:0 6px;margin-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;background:var(--tag);color:var(--tag-ink);border-radius:7px 7px 11px 11px;padding:6px 9px 4px;position:relative;font-size:.92rem;letter-spacing:.02em;white-space:nowrap}
.tag::before{content:"";position:absolute;top:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tag-ink);opacity:.35}
.tag.big{font-size:1.35rem;padding:12px 14px 8px;border-radius:10px 10px 18px 18px}
.tag.big::before{top:5px;width:6px;height:6px;margin-left:-3px}
.tag.none{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.mute{background:var(--surface-2);color:var(--muted)}
.chip.celo{background:var(--tag);color:var(--tag-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* capture */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.capture label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);font-weight:600;cursor:pointer;text-align:center;padding:12px}
.capture label:first-child{background:var(--green);color:var(--green-ink);border:0}
.capture svg{width:30px;height:30px}
.capture input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.preview img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:var(--surface-2)}
@media (max-width:460px){.preview{grid-template-columns:1fr}.preview img{width:100%;height:auto;max-height:260px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.match{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.match img,.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface-2);display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;width:70px}
.meter span{display:block;height:100%;background:var(--green)}
details.guide summary{cursor:pointer;font-weight:600}
details.guide ul{margin:.6em 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* rodeo */
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1 1 150px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .name{font-weight:600}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.summary b{display:block;font-family:var(--mono);font-size:1.25rem}
.summary span{font-size:.75rem;color:var(--muted)}
@media (max-width:460px){.summary{grid-template-columns:repeat(2,1fr)}}
/* ficha */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.hero .pic{width:150px;aspect-ratio:1;max-width:100%;border-radius:var(--r);object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (max-width:500px){.hero{grid-template-columns:1fr}.hero .pic{width:100%;aspect-ratio:4/3}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--mono);font-size:1.05rem}
.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.panels{grid-template-columns:1fr}}
.panel{border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--surface)}
.panel.s-ok{border-left:4px solid var(--ok)}.panel.s-warn{border-left:4px solid var(--warn)}.panel.s-crit{border-left:4px solid var(--crit)}.panel.s-info{border-left:4px solid var(--info)}.panel.s-celo{border-left:4px solid var(--tag)}.panel.s-mute{border-left:4px solid var(--line)}
.panel p{margin:.3em 0 0;font-size:.88rem}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--green)}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding-top:2px}
.ev .x{background:none;border:0;color:var(--muted);padding:2px 6px;border-radius:6px}
.ev .x:hover{color:var(--crit)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:4px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.gallery figcaption{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
/* form / sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:16px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid2 .full{grid-column:1/-1}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.75rem;color:var(--muted)}
.banner{border-radius:10px;padding:10px 12px;font-size:.88rem}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.alertbox{background:var(--crit-soft);color:var(--crit);border:2px solid var(--crit);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.alertbox h3{color:var(--crit)}
.alertbox ul li,.alertbox p{color:var(--ink)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:.9rem;background:var(--surface)}
.checklist input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green)}
.checklist label.imp:not(:has(input:checked)){border-color:var(--crit);background:var(--crit-soft)}
.checklist label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.checklist .req{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--crit);display:block}
.veredicto{border-radius:10px;padding:10px 12px;font-weight:600}
.veredicto.bad{background:var(--crit);color:var(--bg)}
.veredicto.good{background:var(--ok);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:30;max-width:90vw}
.alert-group{display:flex;flex-direction:column;gap:8px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><h1>Caravana Digital</h1><small>Identificación y seguimiento del rodeo · funciona sin internet</small></div></div>
  <div class="spacer"></div>
</div><div class="wrap espwrap"><div class="espbar" id="espBar" role="group" aria-label="Elegir especie"></div></div></header>

<main class="wrap" id="app"></main>

<nav class="nav"><div class="in">
  <button data-go="identificar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Identificar</button>
  <button data-go="rodeo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Rodeo</button>
  <button data-go="alertas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Agenda<span id="navBadge"></span></span></button>
  <button data-go="nuevo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo animal</button>
</div></nav>

<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script src="lib/tf.min.js"></script>
<script src="lib/mobilenet.min.js"></script>
<script src="lib/blazeface.min.js"></script>
<script>
window.__SIN_IA=true;
/* Caravana Digital – versión web.
   Reemplaza los servicios de Claude por: IndexedDB (datos y fotos en el dispositivo)
   y /api/ia (función de Netlify que llama a la IA con la clave guardada en el servidor). */
(function(){
  if (window.claude) return;
  const reqP = r => new Promise((ok,ko)=>{ r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error) });
  let dbp=null;
  function abrir(){
    return dbp ||= new Promise((ok,ko)=>{
      const r=indexedDB.open("caravana-digital",1);
      r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("docs")) d.createObjectStore("docs"); if(!d.objectStoreNames.contains("fotos")) d.createObjectStore("fotos"); };
      r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error);
    });
  }
  async function store(nombre,modo="readonly"){ const d=await abrir(); return d.transaction(nombre,modo).objectStore(nombre) }
  async function todos(nombre){ const s=await store(nombre); const [k,v]=await Promise.all([reqP(s.getAllKeys()),reqP(s.getAll())]); return k.map((key,i)=>[key,v[i]]) }

  /* ---- datos ---- */
  const oyentes={};
  async function emitir(col){
    const filas=(await todos("docs")).filter(([k])=>k.startsWith(col+"/"));
    const snap={docs:filas.map(([k,v])=>({id:k.slice(col.length+1),exists:true,data:()=>v})),size:filas.length,empty:!filas.length};
    (oyentes[col]||[]).forEach(fn=>{ try{fn(snap)}catch(e){console.error(e)} });
  }
  const db={
    collection(col){ return {
      onSnapshot(next){ (oyentes[col] ||= []).push(next); emitir(col); return ()=>{ oyentes[col]=oyentes[col].filter(f=>f!==next) } },
      doc(id){ const key=col+"/"+id; return {
        async set(body){ const s=await store("docs","readwrite"); await reqP(s.put(JSON.parse(JSON.stringify(body)),key)) }, // la app ya actualizó su estado: no se reemite (evita pisar cambios más nuevos)
        async delete(){ const s=await store("docs","readwrite"); await reqP(s.delete(key)) },
        async get(){ const s=await store("docs"); const v=await reqP(s.get(key)); return {id,exists:v!==undefined,data:()=>v} }
      }}
    }}
  };

  /* ---- fotos ---- */
  const urls={};
  const nuevoId=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
  async function precargarFotos(){ for(const [id,blob] of await todos("fotos")) if(!urls[id]) urls[id]=URL.createObjectURL(blob); window.render?.() }
  const assets={
    async upload(blob,opt={}){ const id=nuevoId(); const b=blob.type?blob:new Blob([blob],{type:opt.type||"image/jpeg"}); const s=await store("fotos","readwrite"); await reqP(s.put(b,id)); urls[id]=URL.createObjectURL(b); return {id,url:urls[id],sizeBytes:b.size,contentType:b.type} },
    async delete(id){ const s=await store("fotos","readwrite"); await reqP(s.delete(id)); return {deleted:true} },
    async list(){ return {assets:[],usage:{}} }
  };

  /* ---- IA ---- */
  const CLAVE="cd.codigo";
  let pideCodigo=false;
  const getCodigo=()=>{ try{return localStorage.getItem(CLAVE)||""}catch{return ""} };
  async function aBase64(blob){
    let b=blob;
    try{ const bmp=await createImageBitmap(blob); const esc=Math.min(1,1280/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*esc); c.height=Math.round(bmp.height*esc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); b=await new Promise(r=>c.toBlob(x=>r(x||blob),"image/jpeg",.82)); }catch{}
    const buf=new Uint8Array(await b.arrayBuffer()); let s=""; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return btoa(s);
  }
  async function sample(input,opts={}){
    const prompt=typeof input==="string"?input:input.map(t=>t.content).join("\n\n");
    const imgs=opts.images?[...(opts.images instanceof Blob?[opts.images]:opts.images)]:[];
    let res;
    try{
      res=await fetch("/api/ia",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-codigo":getCodigo()},
        body:JSON.stringify({prompt,images:await Promise.all(imgs.slice(0,5).map(aBase64)),max_tokens:opts.maxTokens||4000})});
    }catch(e){ throw {code:e?.name==="AbortError"?"cancelled":"upstream_error",message:String(e)} }
    if(res.status===401){ pideCodigo=true; try{localStorage.removeItem(CLAVE)}catch{} window.render?.(); throw {code:"codigo",message:"código"} }
    if(res.status===429) throw {code:"rate_limited",message:"límite"};
    if(!res.ok){ let j={}; try{j=await res.json()}catch{} throw {code:j.error==="sin_clave"?"sin_clave":"upstream_error",message:JSON.stringify(j)} }
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf="", text="", stop=null;
    for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf("\n"))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith("data:")) continue; let ev; try{ev=JSON.parse(line.slice(5))}catch{continue}
        if(ev.type==="content_block_delta" && ev.delta?.type==="text_delta"){ text+=ev.delta.text; opts.onText?.({text,delta:ev.delta.text}) }
        else if(ev.type==="message_delta") stop=ev.delta?.stop_reason;
        else if(ev.type==="error") throw {code:ev.error?.type==="overloaded_error"?"rate_limited":"upstream_error",message:ev.error?.message,text};
      } }

    return {text,truncated:stop==="max_tokens",modelTierApplied:"default"};
  }
  function parsear(t){
    try{return JSON.parse(t)}catch{}
    const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{return JSON.parse(f[1])}catch{} }
    const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
    if(a>=0&&b>a){ try{return JSON.parse(t.slice(a,b+1))}catch{} }
    throw {code:"invalid_json",message:"respuesta no es JSON",text:t};
  }
  sample.json=async(input,opts={})=>{ const r=await sample(input,{...opts,maxTokens:5000}); if(r.truncated) throw {code:"invalid_json",text:r.text}; return parsear(r.text) };
  sample.limits=async()=>({maxPromptBytes:80000,images:{maxCount:5,maxInputBytes:20e6,mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}});

  /* ---- copia de seguridad ---- */
  async function exportar(){
    const docs=await todos("docs"), fotos={};
    for(const [id,blob] of await todos("fotos")) fotos[id]={type:blob.type,b64:await aB64crudo(blob)};
    const data=JSON.stringify({app:"caravana-digital",version:1,fecha:new Date().toISOString(),docs:Object.fromEntries(docs),fotos});
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download="caravana-digital-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove();
  }
  async function aB64crudo(blob){ const buf=new Uint8Array(await blob.arrayBuffer()); let s=""; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return btoa(s) }
  async function importar(file){
    const j=JSON.parse(await file.text()); if(j.app!=="caravana-digital") throw new Error("formato");
    let n=0;
    for(const [k,v] of Object.entries(j.docs||{})){ const s=await store("docs","readwrite"); await reqP(s.put(v,k)); n++ }
    for(const [id,f] of Object.entries(j.fotos||{})){ const bin=atob(f.b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      const b=new Blob([u],{type:f.type||"image/jpeg"}); const s=await store("fotos","readwrite"); await reqP(s.put(b,id)); urls[id]=URL.createObjectURL(b) }
    Object.keys(oyentes).forEach(emitir); return n;
  }

  window.__web={ fotoURL:id=>urls[id], pideCodigo:()=>pideCodigo&&!getCodigo(), setCodigo:v=>{ try{localStorage.setItem(CLAVE,v)}catch{} pideCodigo=false }, exportar, importar };
  window.claude={ async use(n){
    if(n==="db"){ try{ await abrir(); return db }catch{ return null } }
    if(n==="assets"){ try{ await abrir(); precargarFotos(); return assets }catch{ return null } }
    if(n==="sample") return window.__SIN_IA ? null : sample;
    return null;
  }};
  try{ navigator.storage?.persist?.() }catch{}
})();

<script>
/* Caravana Digital – motor local (gratis, sin internet para analizar).
   Reconoce la especie con MobileNet, detecta personas con BlazeFace e identifica
   a cada animal comparando la "firma" de la foto con las fotos de referencia
   guardadas en el celular. */
(function(){
  const MOBILENET_URL = "https://storage.googleapis.com/tfjs-models/savedmodel/mobilenet_v2_1.0_224/model.json";
  let mnP=null, bfP=null, estadoModelo="sin cargar";

  function cargarMobilenet(){
    if(mnP) return mnP;
    mnP=(async()=>{
      if(!window.tf||!window.mobilenet){ estadoModelo="no disponible"; return null }
      try{ estadoModelo="cargando"; const m=await mobilenet.load({version:2,alpha:1.0,modelUrl:MOBILENET_URL,inputRange:[0,1]}); estadoModelo="listo"; return m }
      catch(e){ console.warn("MobileNet",e); try{ const m=await mobilenet.load({version:2,alpha:1.0}); estadoModelo="listo"; return m }catch(e2){ console.warn(e2); estadoModelo="no disponible"; return null } }
    })();
    return mnP;
  }
  const esperar=ms=>new Promise(r=>setTimeout(()=>r(null),ms));
  const mnRapido=()=>Promise.race([cargarMobilenet(),esperar(20000)]);
  function cargarBlazeface(){
    if(bfP) return bfP;
    bfP=(async()=>{ if(!window.tf||!window.blazeface) return null; try{ return await blazeface.load({modelUrl:"modelos/blazeface/model.json",maxFaces:3}) }catch(e){ console.warn("BlazeFace",e); return null } })();
    return bfP;
  }

  /* ---------- imagen ---------- */
  async function aCanvas(blob,max=512){
    let src;
    try{ src=await createImageBitmap(blob) }catch{ src=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(blob)}) }
    const w=src.width, h=src.height, s=Math.min(1,max/Math.max(w,h));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
    c.getContext("2d").drawImage(src,0,0,c.width,c.height); return c;
  }
  function recorte(c,f){ // recorte central con fracción f
    const w=Math.round(c.width*f), h=Math.round(c.height*f), x=Math.round((c.width-w)/2), y=Math.round((c.height-h)/2);
    const o=document.createElement("canvas"); o.width=w; o.height=h; o.getContext("2d").drawImage(c,x,y,w,h,0,0,w,h); return o;
  }
  function escalar(c,W,H){ const o=document.createElement("canvas"); o.width=W; o.height=H; o.getContext("2d").drawImage(c,0,0,W,H); return o }

  function rgb2hsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
    if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h/=6; if(h<0) h+=1 }
    return [h, mx?d/mx:0, mx]; }

  function histColor(c){ // 8 tonos x 3 saturación x 3 brillo = 72
    const s=escalar(c,64,64), d=s.getContext("2d").getImageData(0,0,64,64).data, H=new Float32Array(72);
    for(let i=0;i<d.length;i+=4){ const [h,sa,v]=rgb2hsv(d[i],d[i+1],d[i+2]); const hi=Math.min(7,Math.floor(h*8)), si=Math.min(2,Math.floor(sa*3)), vi=Math.min(2,Math.floor(v*3)); H[hi*9+si*3+vi]++ }
    const t=64*64; for(let i=0;i<72;i++) H[i]/=t; return H;
  }
  function histTextura(c){ // gradientes: 4x4 celdas x 8 orientaciones = 128
    const N=96, s=escalar(c,N,N), d=s.getContext("2d").getImageData(0,0,N,N).data, g=new Float32Array(N*N), H=new Float32Array(128);
    for(let i=0;i<N*N;i++) g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
    for(let y=1;y<N-1;y++) for(let x=1;x<N-1;x++){
      const gx=g[y*N+x+1]-g[y*N+x-1], gy=g[(y+1)*N+x]-g[(y-1)*N+x], m=Math.hypot(gx,gy); if(!m) continue;
      let a=Math.atan2(gy,gx); if(a<0) a+=Math.PI; const b=Math.min(7,Math.floor(a/Math.PI*8));
      const cx=Math.min(3,Math.floor(x/(N/4))), cy=Math.min(3,Math.floor(y/(N/4))); H[(cy*4+cx)*8+b]+=m }
    let n=0; for(const v of H) n+=v*v; n=Math.sqrt(n)||1; for(let i=0;i<128;i++) H[i]/=n; return H;
  }
  function pelajeDe(c){
    const s=escalar(recorte(c,.6),32,32), d=s.getContext("2d").getImageData(0,0,32,32).data; let neg=0,bla=0,col=0,ama=0,gri=0,t=0;
    for(let i=0;i<d.length;i+=4){ const [h,sa,v]=rgb2hsv(d[i],d[i+1],d[i+2]); t++;
      if(v<.22) neg++; else if(sa<.18&&v>.72) bla++; else if(sa<.18) gri++; else if(h<.07||h>.95) col++; else if(h<.17) ama++; }
    const p=[["Negro",neg],["Blanco",bla],["Colorado",col],["Bayo / amarillento",ama],["Gris",gri]].sort((a,b)=>b[1]-a[1]);
    if(p[0][1]/t<.45 && p[1][1]/t>.2) return `${p[0][0]} y ${p[1][0].toLowerCase()}`;
    return p[0][0];
  }

  const cos=(a,b)=>{ let s=0,na=0,nb=0; for(let i=0;i<a.length;i++){ s+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i] } return na&&nb? s/Math.sqrt(na*nb) : 0 };
  const inter=(a,b)=>{ let s=0; for(let i=0;i<a.length;i++) s+=Math.min(a[i],b[i]); return s };
  const redondear=a=>Array.from(a,v=>Math.round(v*1000)/1000);

  async function embedding(mn,c){ const t=mn.infer(escalar(c,224,224),true); const v=await t.data(); t.dispose(); return v }

  /* Firma: dos vistas por foto (completa y recorte central) */
  async function firmas(blob){
    const c=await aCanvas(blob), mn=await mnRapido(), out=[];
    for(const v of [c, recorte(c,.7)]){
      out.push({e: mn? redondear(await embedding(mn,v)) : null, c: redondear(histColor(v)), x: redondear(histTextura(v))});
    }
    return out;
  }
  function similitud(q,r){
    if(q.e && r.e) return .7*cos(q.e,r.e) + .2*inter(q.c,r.c) + .1*cos(q.x,r.x);
    return .6*inter(q.c,r.c) + .4*cos(q.x,r.x);
  }

  /* ---------- especie ---------- */
  const MAPA=[
    [/water buffalo|bison/i,"Bubalino"],[/\box\b/i,"Bovino"],[/hog|wild boar|piggy/i,"Porcino"],
    [/\bram\b|bighorn/i,"Ovino"],[/ibex/i,"Caprino"],[/hare|rabbit|angora/i,"Cunicola"],
    [/\bhen\b|\bcock\b/i,"Aviar"],[/drake|goose|red-breasted merganser/i,"Pato"],[/quail|partridge/i,"Codorniz"],
    [/black grouse|ptarmigan|prairie chicken/i,"Aviar"],[/llama|camel/i,"Camelido"],[/sorrel/i,"Equino"],
    [/hamster|guinea pig|marmot|chinchilla/i,"Chinchilla"]
  ];
  const TRAD={"ox":"buey / vacuno","hog, pig, grunter, squealer":"cerdo","ram, tup":"carnero","hen":"gallina","cock":"gallo","drake":"pato","goose":"ganso","llama":"llama","sorrel":"caballo","water buffalo, water ox, Asiatic buffalo, Bubalus bubalis":"búfalo"};

  async function especie(c){
    const mn=await mnRapido(); if(!mn) return {especie:null,etiquetas:[]};
    const res=await mn.classify(escalar(c,224,224),10);
    const votos={}; for(const r of res){ const m=MAPA.find(([re])=>re.test(r.className)); if(m) votos[m[1]]=(votos[m[1]]||0)+r.probability }
    const mejor=Object.entries(votos).sort((a,b)=>b[1]-a[1])[0];
    return {especie:mejor&&mejor[1]>.15?mejor[0]:null, prob:mejor?mejor[1]:0, etiquetas:res.slice(0,3).map(r=>`${TRAD[r.className]||r.className.split(",")[0]} ${Math.round(r.probability*100)}%`)};
  }
  async function esPersona(c){
    const bf=await Promise.race([cargarBlazeface(),esperar(8000)]); if(!bf) return false;
    try{ const W=Math.min(640,c.width), H=Math.round(W*c.height/c.width);
      const caras=await bf.estimateFaces(escalar(c,W,H),false);
      return caras.some(f=>{
        const p=Array.isArray(f.probability)?f.probability[0]:f.probability; if(!(p>.96)) return false;
        const bw=f.bottomRight[0]-f.topLeft[0], bh=f.bottomRight[1]-f.topLeft[1]; if(bw*bh<W*H*.02) return false;
        const L=f.landmarks; if(!L||L.length<4) return false;
        const [ojoD,ojoI,nariz,boca]=L, dOjos=Math.abs(ojoI[0]-ojoD[0]);
        return Math.abs(ojoI[1]-ojoD[1])<bh*.2 && dOjos>bw*.25 && dOjos<bw*.65 && nariz[1]>Math.min(ojoD[1],ojoI[1]) && boca[1]>nariz[1];
      }) }catch{ return false }
  }
  /* ---------- identificar ---------- */
  async function identificar(blob,animales,espSel,opciones={}){
    const c=await aCanvas(blob,640);
    const [sp,q,persona]=await Promise.all([especie(c),firmas(blob),opciones.sinPersona?false:esPersona(c)]);
    if(persona && !(sp.especie && sp.prob>.25)) return {es_humano:true};
    const esp=espSel||sp.especie;
    const pool=animales.filter(a=>a.estado==="activo" && (a.firmas||[]).length && (!esp||a.especie===esp));
    const conEmb=q[0].e!=null, base=conEmb?.6:.5;
    const lista=pool.map(a=>{ let mejor=0, tipo=""; for(const r of a.firmas){ for(const qq of q){ const s=similitud(qq,r); if(s>mejor){ mejor=s; tipo=r.t } } } return {a,s:mejor,tipo} }).sort((x,y)=>y.s-x.s);
    const top=lista[0], seg=lista[1];
    const coinc=lista.slice(0,4).map((x,i)=>{
      let conf=Math.max(0,Math.min(1,(x.s-base)/(1-base)));
      if(i===0 && seg) conf=Math.min(1,conf+Math.max(0,(x.s-seg.s))*2); // ventaja sobre el segundo
      return {id:x.a.id, confianza:Math.round(conf*100), motivo:`Parecido ${Math.round(x.s*100)}/100 con su foto de ${(x.tipo||"referencia").toLowerCase()} · ${x.a.firmas.length/2|0} foto${x.a.firmas.length>2?"s":""} de referencia`};
    }).filter(x=>x.confianza>=20);
    const sinRef=animales.filter(a=>a.estado==="activo"&&(!esp||a.especie===esp)&&!(a.firmas||[]).length).length;
    return {
      local:true, es_animal:true, especie:esp||sp.especie||"", especie_detectada:sp.especie, raza_probable:"", sexo_probable:"?",
      pelaje:pelajeDe(c), coincidencias:coinc, firmaConsulta:q,
      calidad_foto: sp.etiquetas.length?`El modelo ve: ${sp.etiquetas.join(", ")}.`:(estadoModelo==="no disponible"?"El modelo de especies no se pudo cargar (sin internet la primera vez). Se comparó solo por color y textura.":""),
      sugerencia_foto: !pool.length? (sinRef?`Hay ${sinRef} animales sin foto de referencia: cargales una foto de perfil en su ficha para poder reconocerlos.`:"Todavía no hay animales con foto de referencia. Registrá este como nuevo.") : (coinc[0]?.confianza<60?"Probá con la misma pose que la foto de referencia (de costado, a la altura del animal) y buena luz.":"")
    };
  }

  /* ---------- dieta por tablas ---------- */
  const MS={"Pastura (alfalfa, festuca)":.22,"Verdeo de invierno (avena, raigrás)":.18,"Campo natural":.35,"Rollo / fardo":.86,"Silo de maíz":.35,"Silo de sorgo":.33,"Grano de maíz":.88,"Grano de sorgo":.88,"Expeller de soja":.9,"Pellet de girasol":.9,"Burlanda / DDGS":.9,"Núcleo mineral":1,"Maíz":.88,"Sorgo":.88,"Harina de soja":.89,"Afrechillo de trigo":.88,"Núcleo vitamínico-mineral":1,"Alimento balanceado comercial":.89,"Conchilla":1,"Alfalfa (fardo o pellet)":.88,"Heno de gramíneas":.87,"Pellet balanceado para conejo":.89,"Pellet para chinchilla":.89,"Avena":.88,"Afrechillo":.88};
  const primero=(disp,lista)=>lista.find(x=>disp.includes(x));
  function kg(x){ return x>=10?`${Math.round(x)} kg`:x>=1?`${x.toFixed(1).replace(".",",")} kg`:`${Math.round(x*1000)} g` }

  function dieta(a,st,inp,ctx){
    const {espDe,grupoDieta,cant,estado:_}=ctx; const e=espDe(a), g=grupoDieta(a.especie), pv=st.peso||e.obj*.6, n=cant(a), obj=inp.objetivo, sis=inp.sistema||"";
    const disp=[...inp.alimentos, ...(inp.otros?inp.otros.split(/,|;/).map(s=>s.trim()).filter(Boolean):[])];
    const R={requerimientos:[],racion:[],precauciones:[],controlar:[],alternativas:[],resultado_esperado:{}};
    const add=(al,kgTC,nota)=>{ if(!al||kgTC<=0) return; R.racion.push({alimento:al,cantidad:kg(kgTC),total_lote:n>1?kg(kgTC*n):"",nota}) };
    const tc=(al,msKg)=>msKg/(MS[al]||.88);
    if(g==="rumiante"){
      const t={"Engorde a faena":[2.6,12.5,2.6,sis.includes("feedlot")?1.3:sis.includes("suplemento")?.9:.7],"Terminación rápida":[2.7,12,2.8,1.3],"Recría (crecimiento)":[2.5,14,2.4,.6],"Gestación":[2,st.parto&&dias(hoy(),st.parto)<90?11:9,2.1,.2],"Lactancia (cría al pie)":[2.5,12,2.4,0],"Servicio / reproducción":[2.2,11,2.3,0],"Mantenimiento":[1.9,8.5,2,0],"Recuperar estado corporal":[2.3,11,2.4,.4]}[obj]||[2.2,11,2.3,.5];
      const pc=(e===undefined)?1:(["Ovino","Caprino"].includes(a.especie)?1.35:a.especie==="Camelido"?.85:1);
      const fg={Ovino:.25,Caprino:.2,Camelido:.3,Bubalino:.9}[a.especie]||1; t[3]=Math.round(t[3]*fg*100)/100;
      const msd=pv*t[0]*pc/100; R.requerimientos.push({nutriente:"Materia seca",valor:`${kg(msd)}/día`},{nutriente:"Proteína bruta",valor:`${String(t[1]).replace(".",",")} % de la MS`},{nutriente:"Energía",valor:`${String(t[2]).replace(".",",")} Mcal EM/kg MS`});
      const forr=primero(disp,["Silo de maíz","Silo de sorgo","Rollo / fardo","Pastura (alfalfa, festuca)","Verdeo de invierno (avena, raigrás)","Campo natural"])||"Rollo / fardo";
      const gran=primero(disp,["Grano de maíz","Grano de sorgo"]), prot=primero(disp,["Expeller de soja","Pellet de girasol","Burlanda / DDGS"]);
      const encierre=sis.includes("feedlot")||obj==="Terminación rápida";
      let pF=encierre?.2:obj.includes("Engorde")?.7:obj==="Recría (crecimiento)"?.75:obj==="Mantenimiento"||obj==="Gestación"?1:.8;
      let pP=t[1]>=12?(encierre?.12:.1):t[1]>=11?.06:0; if(!prot) pP=0; let pG=gran?Math.max(0,1-pF-pP-(encierre?.02:0)):0;
      if(!gran){ pF=1-pP } else if(pG===0) pF=1-pP;
      const pastoreo=/Pastura|Verdeo|Campo/.test(forr);
      add(forr, pastoreo?tc(forr,msd*pF):tc(forr,msd*pF), pastoreo?"Pastoreo: asignar la parcela para que deje remanente de 5–7 cm":"En comedero, en una o dos entregas");

      out.alerts.push({n:cerca?"crit":"warn",t:(ev.e?`Lugar de parto NO apto: ${ev.faltas[0]}${ev.faltas.length>1?` (+${ev.faltas.length-1})`:""}`:`Lugar de parto sin revisar`)+(d!=null?` · ${espDe(a).ave?"nacimiento":"parto"} ${enDias(d)}`:""),f:fp?sumar(fp,-ev.cfg.mover):h,k:"mat"});
    }
  }
  // faena
  if(a.pesoObjetivo && out.peso!=null && a.estado==="activo"){
    const falta=a.pesoObjetivo-out.peso;
    if(falta<=0){ out.faena={listo:!car}; out.alerts.push(car?{n:"warn",t:`Llegó a ${a.pesoObjetivo} kg pero está en carencia`,f:car.hasta,k:"faena"}:{n:"ok",t:`Listo para faena: ${out.peso} kg (objetivo ${a.pesoObjetivo})`,f:h,k:"faena"}) }
    else if(out.gdp>0){ const d=Math.ceil(falta/out.gdp); out.faena={listo:false,dias:d,fecha:sumar(out.fPeso,d)} ; if(dias(h,out.faena.fecha)<=30) out.alerts.push({n:"info",t:`Llega a peso de faena cerca del ${fmt(out.faena.fecha)}`,f:out.faena.fecha,k:"faena"}) }
    else out.faena={listo:false};
  }
  if(a.estado==="activo" && (!out.fPeso || dias(out.fPeso,h)>90)) out.alerts.push({n:"mute",t:out.fPeso?`Sin pesar desde ${fmt(out.fPeso)}`:"Sin pesadas registradas",f:h,k:"pesadas"});
  return out;
}

async function shrink(file,max=1600){
  try{
    const url=URL.createObjectURL(file), img=new Image();
    await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85));
  }catch{return file}
}

  else h+=`<div class="list">${list.map(a=>{const st=sts[a.id];return `<button class="item" data-open="${a.id}">${thumb(a)}
    <div><div class="l1">${tagHTML(a)}<span class="name">${esc(a.nombre||"")}</span></div><div class="small muted">${esc([S.esp?"":espDe(a).nombre,a.raza,a.categoria,cant(a)>1?`lote de ${cant(a)}`:"",edadTxt(a.fechaNac)].filter(x=>x&&x!=="—").join(" · "))}</div><div class="chips" style="margin-top:4px">${chipsFor(a,st)}</div></div>
    <div class="r"><span class="num">${st.peso!=null?st.peso+" kg":"—"}</span>${st.gdp!=null?`<span class="small muted num">${st.gdp>=0?"+":""}${(st.gdp*1000).toFixed(0)} g/d</span>`:""}</div></button>`}).join("")}</div>`;
  if(window.__web) h+=`<div class="card stack" style="gap:8px"><h3>Copia de seguridad</h3><p class="small muted" style="margin:0">Los datos quedan guardados en este dispositivo. Exportá una copia seguido y usala para pasar el rodeo a otro celular.</p><div class="row"><button class="btn sm" id="btnExport">Exportar copia</button><label class="btn sm" for="impIn">Importar copia<input id="impIn" type="file" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0"></label></div></div>`;
  return h+`</div>`;
}

function rankingMadres(list,sts){
  const ms=list.filter(a=>sts[a.id].madre).sort((p,q)=>(sts[q.id].madre.score??-1)-(sts[p.id].madre.score??-1));
  const sinPartos=list.filter(a=>esHembra(a)&&!espDe(a).ave&&!sts[a.id].madre&&!/ternera|bucerra|cordera|cabrita|cachorra|potranca|cría/i.test(a.categoria||"")).length;
  if(!ms.length) return `<div class="card empty">Todavía no hay partos registrados. En la ficha de cada hembra, en Reproducción, cargá el parto con nacidos, vivos y pesos, y después el destete.</div>`;
  const bajo=ms.filter(a=>{const m=sts[a.id].madre;return !m.preliminar&&m.score<55});
  return `<p class="small muted" style="margin:0">Nota de 0 a 100: crías nacidas vivas (30%), supervivencia al destete (30%), intervalo entre partos (20%), habilidad materna y facilidad de parto (20%), comparadas con la referencia de cada especie.${sinPartos?` Hay ${sinPartos} hembras adultas sin partos registrados.`:""}</p>
  ${bajo.length?`<div class="banner warn">${bajo.length} madre${bajo.length>1?"s":""} con nota menor a 55 y al menos 2 partos: candidatas a reemplazo.</div>`:""}
  <div class="card tbl" style="padding:0"><table class="ration"><thead><tr><th>Madre</th><th>Nota</th><th>Partos</th><th>Vivos/parto</th><th>Superv.</th><th>Intervalo</th><th>Kg dest./año</th></tr></thead><tbody>
  ${ms.map(a=>{const m=sts[a.id].madre;return `<tr data-open="${a.id}" style="cursor:pointer"><td>${tagHTML(a)} <span class="small">${esc(a.nombre||"")}</span>${S.esp?"":`<div class="small muted">${esc(espDe(a).nombre)}</div>`}</td><td>${m.verdict?`<span class="chip ${m.verdict[0]}">${m.score}</span>`:"—"}${m.preliminar?' <span class="small muted">prelim.</span>':""}</td><td class="q">${m.n}</td><td class="q">${r1(m.vivos)}</td><td class="q">${pct(m.sup)}</td><td class="q">${m.iep?Math.round(m.iep)+"d":"—"}</td><td class="q">${kgTxt(m.kgAnio)}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

function vAlertas(){
  const items=[];
  for(const a of visibles()) if(a.estado==="activo") for(const x of estado(a).alerts) items.push({...x,a});
  const orden={crit:0,celo:1,warn:2,info:3,ok:4,mute:5};
  items.sort((p,q)=>orden[p.n]-orden[q.n]||(p.f<q.f?-1:1));
  const grupos=[["Urgente",x=>x.n==="crit"],["Celos a controlar",x=>x.n==="celo"],["Atención",x=>x.n==="warn"],["Próximos días",x=>x.n==="info"],["Listos para faena",x=>x.n==="ok"],["Pesadas atrasadas",x=>x.n==="mute"]];
  let h=`<div class="section"><div><h2>Agenda del rodeo</h2><p class="muted small" style="margin:.3em 0 0">${(()=>{const e=S.esp&&ESPECIES[S.esp];if(!e)return "Calculada con los registros y los parámetros de cada especie: ciclo estral, gestación o incubación, carencias y ganancia diaria entre pesadas.";return e.ave?`${e.nombre}: incubación de ${e.incub} días, carencias y ganancia diaria entre pesadas.`:`${e.nombre}: ${e.ciclo?`celo cada ${e.ciclo} días`:"ovulación inducida (sin celo cíclico)"}, gestación de ${e.gest} días, diagnóstico de preñez a los ${e.tacto} días del servicio.`})()}</p></div>`;
  if(!items.length) h+=`<div class="card empty">No hay nada pendiente.</div>`;
  for(const [t,fn] of grupos){const g=items.filter(fn); if(!g.length)continue;
    h+=`<div class="alert-group"><div class="eyebrow">${t} · ${g.length}</div><div class="list">${g.map(x=>`<button class="item" data-open="${x.a.id}" data-tab="${x.k}">${thumb(x.a)}<div><div class="l1">${tagHTML(x.a)}<span class="name">${esc(x.a.nombre||"")}</span></div><div class="small">${esc(x.t)}</div></div><span class="chip ${x.n}">${fmt(x.f)}</span></button>`).join("")}</div></div>`;
  }
  return h+`</div>`;
}

function panelRepro(a,st,esp){

  if(st.prenada) return `<div class="panel s-info"><h3>Preñada</h3><p>Parto estimado <b class="num">${fmt(st.parto)}</b>${st.parto?` (${enDias(dias(hoy(),st.parto))})`:""}.</p><p class="muted small">Según ${esc(st.base)} y ${esp.gest} días de gestación.</p></div>`;

function panelFaena(a,st){

function detalleRepro(x,pp,esp){
  const s=[];
  if(x.tipo==="paricion"){
    if(x.totales!=null||x.vivos!=null) s.push(`${x.totales??x.vivos} nacidos${x.vivos!=null&&x.totales!=null?`, ${x.vivos} vivos`:""}${+x.momificados?`, ${x.momificados} momificados`:""}`);
    if(x.machos!=null||x.hembras!=null) s.push(`${x.machos||0} ♂ / ${x.hembras||0} ♀`);
    if(pp?.nacer!=null) s.push(`${kgTxt(pp.nacer)} al nacer`);
    if(x.tipoParto) s.push(x.tipoParto.toLowerCase());
    if(+x.transfer) s.push(`${x.transfer>0?"+":""}${x.transfer} adoptadas/cedidas`);
    let g=""; if(pp?.gest!=null) g=`<div class="small">A los ${gestTxt(pp.gest,esp)} de gestación ${pp.prematuro?'<span class="chip warn">antes de término</span>':pp.tardio?'<span class="chip warn">prolongada</span>':'<span class="chip ok">a término</span>'}</div>`;
    return (s.length?` · ${esc(s.join(" · "))}`:"")+g+(x.habilidad?`<div class="small muted">Habilidad materna ${x.habilidad}/5${x.calostro==="no"?" · no tomaron calostro a tiempo":""}</div>`:"");
  }
  if(x.tipo==="destete"){ if(x.destetados!=null) s.push(`${x.destetados} destetados`); const p=num(x.pesoProm)??(num(x.pesoCamada)&&x.destetados?x.pesoCamada/x.destetados:null); if(p!=null) s.push(kgTxt(p)+" promedio"); if(num(x.pesoCamada)) s.push(kgTxt(+x.pesoCamada)+" la camada"); }
  if(x.tipo==="baja_cria"){ s.push(`${x.cantidad||1} cría${(x.cantidad||1)>1?"s":""}`); if(x.causa) s.push(x.causa); if(x.edadCria) s.push(`${x.edadCria} días de vida`); }
  if(x.tipo==="incubacion" && x.huevos) s.push(`${x.huevos} huevos`);
  if(x.tipo==="eclosion" && x.nacidos) s.push(`${x.nacidos} nacidos${x.huevos?` de ${x.huevos} (${pct(x.nacidos/x.huevos)})`:""}`);
  if(x.tipo==="postura" && x.huevos) s.push(`${x.huevos} huevos`);
  if(x.tipo==="aborto" && x.mesGest) s.push(`a los ${x.mesGest}`);
  return s.length?` · ${esc(s.join(" · "))}`:"";
}
function madreHTML(a,m){

      <div><span>Supervivencia al destete</span>${cmp(m.sup,B.sup,"hi",pct)}</div>
      <div><span>Peso al nacer</span>${cmp(m.nacer,B.nacer,"hi",kgTxt)}</div>
      <div><span>Peso al destete</span>${cmp(m.pDest,B.dest,"hi",kgTxt)}</div>

      <div><span>Kg destetados / año</span>${cmp(m.kgAnio,m.kgRef,"hi",kgTxt)}</div>
      <div><span>Partos sin ayuda</span><b>${pct(m.faciles)}</b></div>
      <div><span>Habilidad materna</span><b>${m.hab!=null?r1(m.hab)+"/5":"—"}</b></div>
    </div>

    <div class="tbl"><table class="ration"><thead><tr><th>Parto</th><th>Gestación</th><th>Nac./vivos</th><th>Peso nacer</th><th>Muertes</th><th>Destet.</th><th>Superv.</th><th>Peso dest.</th><th>Intervalo</th></tr></thead><tbody>
    ${m.partos.map(x=>`<tr><td class="q">${fmt(x.p.fecha)}</td><td class="q">${x.gest!=null?x.gest+"d":"—"}${x.prematuro?" ⚠":""}</td><td class="q">${x.tot??"—"}/${x.vivos??"—"}</td><td class="q">${kgTxt(x.nacer)}</td><td class="q">${x.bajas||0}</td><td class="q">${x.destetados??"—"}</td><td class="q">${pct(x.sup)}</td><td class="q">${kgTxt(x.pDest)}${x.edadDest!=null?` (${x.edadDest}d)`:""}</td><td class="q">${x.iep!=null?x.iep+"d":"—"}</td></tr>`).join("")}

  return h+`</div>`;
}
function chartPesos(p){
  if(p.length<2) return "";
  const W=600,H=170,pl=44,pr=14,pt=14,pb=26;
  const t0=Date.parse(p[0].fecha),t1=Date.parse(p[p.length-1].fecha)||t0+1;
  let mn=Math.min(...p.map(x=>x.kg)),mx=Math.max(...p.map(x=>x.kg)); const pad=Math.max(10,(mx-mn)*.15); mn=Math.max(0,Math.floor((mn-pad)/10)*10); mx=Math.ceil((mx+pad)/10)*10;
  const X=f=>pl+(Date.parse(f)-t0)/((t1-t0)||1)*(W-pl-pr), Y=k=>pt+(1-(k-mn)/(mx-mn))*(H-pt-pb);
  const ticks=[mn,Math.round((mn+mx)/20)*10,mx];
  const pts=p.map(x=>`${X(x.fecha).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
  const last=p[p.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de peso">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${t}</text>`).join("")}
    <polygon points="${X(p[0].fecha)},${H-pb} ${pts} ${X(last.fecha)},${H-pb}" fill="var(--green)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>
    ${p.map(x=>`<circle cx="${X(x.fecha)}" cy="${Y(x.kg)}" r="3" fill="var(--surface)" stroke="var(--green)" stroke-width="2"/>`).join("")}
    <circle cx="${X(last.fecha)}" cy="${Y(last.kg)}" r="5" fill="var(--green)"/>
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmt(p[0].fecha)}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmt(last.fecha)}</text>
  </svg></div>`;
}

const OBJETIVOS = ["Engorde a faena","Recría (crecimiento)","Terminación rápida","Gestación","Lactancia (cría al pie)","Servicio / reproducción","Mantenimiento","Recuperar estado corporal"];
const SISTEMAS = {rumiante:["Pastoril","Pastoril con suplemento","Encierre a corral (feedlot)","Mixto"],monogastrico:["Confinamiento","A campo","Mixto"],ave:["Galpón (confinamiento)","A campo / pastoreo","Mixto"],herbivoro:["Jaula","Corral / galpón","A campo"]};
function objetivoSugerido(a,st){
  if(st.prenada) return "Gestación";
  const par=[...sortF(a.repro)].reverse().find(r=>r.tipo==="paricion"), des=par&&(a.repro||[]).find(r=>r.tipo==="destete"&&r.fecha>=par.fecha);
  if(par && !des && dias(par.fecha,hoy())<220) return "Lactancia (cría al pie)";
  if(a.pesoObjetivo) return (st.peso && st.peso/a.pesoObjetivo>.85)?"Terminación rápida":"Engorde a faena";
  if(st.cc && st.cc<2.5) return "Recuperar estado corporal";
  if(!esHembra(a) && /toro|padrillo|carnero|chivato|reproductor|gallo|macho/i.test(a.categoria||"")) return "Servicio / reproducción";
  if(a.fechaNac && dias(a.fechaNac,hoy())<365) return "Recría (crecimiento)";
  return "Mantenimiento";
}

function fichaTexto(a,st){
  const e=espDe(a), L=[];
  L.push(`Especie: ${e.nombre} (${a.especie}). Raza: ${a.raza||"s/d"}. Categoría: ${a.categoria||"s/d"}. Sexo: ${a.sexo==="H"?"hembra":a.sexo==="M"?"macho":"s/d"}.`);
  L.push(`Edad: ${edadTxt(a.fechaNac)}${a.fechaNac?` (nacido ${a.fechaNac})`:""}. ${cant(a)>1?`Es un LOTE de ${cant(a)} cabezas; los pesos son promedio por cabeza.`:"Animal individual."}`);
  L.push(`Pesadas (fecha: kg, CC 1-5): ${sortF(a.pesadas).slice(-8).map(p=>`${p.fecha}: ${p.kg}${p.cc?` CC${p.cc}`:""}`).join("; ")||"sin pesadas"}.`);
  L.push(`Peso actual: ${st.peso??"s/d"} kg. Ganancia diaria reciente: ${st.gdp!=null?(st.gdp*1000).toFixed(0)+" g/día":"s/d"}. Condición corporal: ${st.cc??"s/d"}. Peso objetivo de faena: ${a.pesoObjetivo||"no definido"} (referencia de la especie ${e.obj} kg).`);
  L.push(`Reproducción: ${st.prenada?`preñada, parto estimado ${st.parto}`:st.servPend?`servida el ${st.servPend.fecha}, sin diagnóstico`:st.eclosion?`en incubación, eclosión ${st.eclosion}`:"sin gestación registrada"}. Eventos: ${sortF(a.repro).slice(-6).map(r=>`${r.fecha} ${REPRO_TIPOS[r.tipo]||r.tipo}${r.resultado?" "+r.resultado:""}${r.detalle?" ("+r.detalle+")":""}`).join("; ")||"ninguno"}.`);
  L.push(`Sanidad: ${sortF(a.sanidad).slice(-6).map(s=>`${s.fecha} ${s.tipo} ${s.producto||""}${s.obs?" - "+s.obs:""}`).join("; ")||"sin registros"}. ${st.carencia?`En carencia hasta ${st.carencia.hasta}.`:""}`);
  if(st.madre){const m=st.madre; L.push(`Como madre: ${m.n} partos, ${r1(m.vivos)} vivos/parto, supervivencia al destete ${pct(m.sup)}, peso al destete ${kgTxt(m.pDest)}, intervalo entre partos ${m.iep?Math.round(m.iep)+" días":"s/d"}, nota ${m.score??"s/d"}/100.`);
    const u=m.partos[m.partos.length-1]; if(!u.dest) L.push(`Tiene cría al pie: parió el ${u.p.fecha} (${u.vivos??"?"} crías vivas).`);}

  return L.join("\n").slice(0,6000);
}
async function recomendarDieta(id,inp){
  const a=animals[id]; if(!a) return; const st=estado(a); S.dieta={busy:true,err:""}; S.fichaTab="dieta"; render();
  if(window.__local){
    try{ const r=window.__local.dieta(a,st,inp,{espDe,grupoDieta,cant}); save({...animals[id],dietas:[...(animals[id].dietas||[]),{fecha:hoy(),...inp,r}].slice(-5)}); S.dieta={busy:false,err:""} }
    catch(e){ console.error(e); S.dieta={busy:false,err:"No se pudo calcular la ración."} }
    render(); return;
  }
  const prompt=`Sos nutricionista de producción animal en Argentina (hemisferio sur). Fecha de hoy: ${hoy()}.
Armá una ración práctica para este ${cant(a)>1?"lote":"animal"}, con el objetivo de producir la mayor cantidad de carne con la mejor eficiencia (conversión alimenticia y costo), sin comprometer la salud ni la reproducción.

FICHA:
${fichaTexto(a,st)}

OBJETIVO ELEGIDO: ${inp.objetivo}
SISTEMA: ${inp.sistema}
ALIMENTOS DISPONIBLES: ${[...inp.alimentos,inp.otros].filter(Boolean).join(", ")||"no indicó; proponé una ración con alimentos comunes en Argentina"}
${inp.extra?`DATOS DEL PRODUCTOR: ${inp.extra}`:""}

Reglas: usá requerimientos acordes a la especie, categoría, peso y estado (gestación, lactancia, crecimiento). Priorizá los alimentos disponibles. Cantidades en kg o g tal cual (as fed) por cabeza por día, redondeadas y fáciles de medir${cant(a)>1?`, y el total diario para las ${cant(a)} cabezas`:""}. Si la ganancia actual está por debajo de lo esperable para la categoría, decilo en el diagnóstico. Si está en carencia o tiene un problema sanitario, tenelo en cuenta. No inventes datos que no están en la ficha.

Respondé solo con JSON:
{"diagnostico":"2-3 frases sobre su estado y cuánto puede mejorar","requerimientos":[{"nutriente":"Materia seca","valor":"9,5 kg/día"},{"nutriente":"Proteína bruta","valor":"13 %"},{"nutriente":"Energía","valor":"2,6 Mcal EM/kg MS"}],"racion":[{"alimento":"","cantidad":"","total_lote":"","nota":"cómo darlo"}],"agua":"","minerales":"","transicion":"cómo acostumbrarlo sin riesgo","resultado_esperado":{"ganancia_diaria":"","conversion":"kg alimento por kg ganado","dias_a_objetivo":""},"precauciones":[""],"controlar":["qué medir y cada cuánto para ajustar"],"alternativas":["qué cambiar si falta un alimento"]}
Textos breves, en español rioplatense.`;
  try{
    const r=await sample.json(prompt);
    const cur=animals[id]; if(!cur) return;
    const reg={fecha:hoy(),...inp,r};
    save({...cur,dietas:[...(cur.dietas||[]),reg].slice(-5)});
    S.dieta={busy:false,err:""};
  }catch(e){ S.dieta={busy:false,err:e?.code==="invalid_json"?"La respuesta vino incompleta. Probá de nuevo.":errTxt(e).replace("analizar la foto","calcular la dieta")} }
  render();
}

const fld=(id,label,inner,cls="",hint="")=>`<div class="field ${cls}"><label for="${id}">${label}</label>${inner}${hint?`<span class="hint">${hint}</span>`:""}</div>`;
const inp=(id,v="",type="text",extra="")=>`<input id="${id}" name="${id}" type="${type}" value="${esc(v)}" ${extra}>`;
const sel=(id,opts,v="")=>`<select id="${id}" name="${id}">${opts.map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(t)}</option>`}).join("")}</select>`;

    ${fld("categoria","Categoría",sel("categoria",["",...esp.cats],a.categoria))}

    ${fld("origen","Origen",inp("origen",a.origen,"text",'placeholder="Nacido en el campo, comprado a…"'))}

    ${fld("estado","Estado",sel("estado",[["activo","Activo"],["vendido","Vendido"],["faenado","Faenado"],["muerto","Muerto"]],a.estado))}

    ${fld("producto","Producto / enfermedad",inp("producto","","text",'placeholder="Aftosa, ivermectina, queratoconjuntivitis…"'))}${fld("dosis","Dosis y vía",inp("dosis","","text",'placeholder="5 ml subcutánea"'))}
    ${fld("carencia","Días de carencia (retiro)",inp("carencia","","number",'min="0" step="1" inputmode="numeric"'),"","Está en el marbete del producto. Bloquea la faena hasta que se cumpla.")}${fld("vet","Veterinario",inp("vet"))}
    ${fld("obs","Observaciones / diagnóstico",`<textarea id="obs" name="obs"></textarea>`,"full")}</div>`;
  if(k==="notas") inner=`<h2>Nueva nota</h2><div class="grid2">${fld("fecha","Fecha",inp("fecha",h,"date",'required'))}${fld("texto","Nota",`<textarea id="texto" name="texto" required></textarea>`,"full")}</div>`;

  if(k==="repro"){const up=()=>{const t=$("#tipo").value;document.querySelectorAll("#fEv [data-for]").forEach(w=>w.hidden=!w.dataset.for.split(" ").includes(t))};$("#tipo").onchange=up;up();
    const pre=S.preTipo; if(pre&&reproTipos(a).includes(pre)){$("#tipo").value=pre;up()} S.preTipo=null;
    const f=$("#fecha"), ag=$("#agGest"); const upG=()=>{ if(!ag) return; const t=$("#tipo").value, serv=[...sortF(a.repro)].reverse().find(r=>r.tipo==="servicio"&&r.fecha<f.value);
      if((t==="paricion"||t==="aborto") && serv){const d=dias(serv.fecha,f.value); ag.textContent=`Servicio del ${fmt(serv.fecha)}: ${t==="paricion"?"parió":"abortó"} a los ${gestTxt(d,espDe(a))} de gestación (normal: ${espDe(a).gest} días).`; ag.hidden=false} else ag.hidden=true };
    f.addEventListener("change",upG); $("#tipo").addEventListener("change",upG); upG();}
  $("#fEv").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r={fecha:d.fecha};
    if(k==="pesadas"){r.kg=+d.kg;if(d.cc)r.cc=+d.cc;if(d.obs)r.obs=d.obs}
    let crias=null;
    if(k==="repro"){r.tipo=d.tipo;
      const put=(key,src=key)=>{const v=num(d[src]); if(v!=null) r[key]=v};
      if(d.tipo==="tacto"){r.resultado=d.resultado;put("meses")}
      if(d.tipo==="paricion"){["totales","vivos","momificados","machos","hembras","pesoProm","pesoCamada","transfer","habilidad"].forEach(x=>put(x)); if(r.totales!=null&&r.vivos==null) r.vivos=r.totales; if(d.tipoParto) r.tipoParto=d.tipoParto; if(d.calostro) r.calostro=d.calostro; if(d.crearCrias) crias=true}
      if(d.tipo==="destete"){put("destetados");put("pesoProm","pesoPromD");put("pesoCamada","pesoCamadaD")}

      if(d.tipo==="aborto" && d.mesGest) r.mesGest=d.mesGest;
      if(["postura","incubacion"].includes(d.tipo)) put("huevos");
      if(d.tipo==="eclosion"){put("huevos","huevosE");put("nacidos")}
      if(d.detalle)r.detalle=d.detalle}
    if(k==="sanidad"){Object.assign(r,{tipo:d.tipo,producto:d.producto,dosis:d.dosis,vet:d.vet,obs:d.obs});if(d.carencia)r.carencia=+d.carencia}
    if(k==="notas") r.texto=d.texto;
    const b={...a,[k]:[...(a[k]||[]),r]}; closeSheet(); save(b);
    if(crias && r.vivos>0) crearCrias(b,r); else toast("Guardado");
    if(k==="repro" && ((r.tipo==="tacto"&&r.resultado==="preñada")||r.tipo==="incubacion")){ const ev=evalMat(b); if(ev && !ev.ok) setTimeout(()=>formMaternidad(animals[b.id]||b,true),350) }
  };
}
function formMaternidad(a,alerta){
  const cfg=MATERNIDAD[a.especie]; if(!cfg) return;
  const prev=a.maternidad||{}, chk=new Set(prev.checks||[]), st=estado(a), fp=st.parto||st.eclosion;
  openSheet(`<form id="fMat" class="stack">
  ${alerta?`<div class="alertbox" role="alert"><h3>${esc(a.caravana||a.nombre||"Esta hembra")} está ${espDe(a).ave?"en incubación":"preñada"}: revisá dónde va a ${espDe(a).ave?"nacer la cría":"parir"}</h3><p style="margin:0">Un lugar chico, frío o mal preparado es la principal causa de crías muertas por aplastamiento, frío o hambre.${fp?` ${espDe(a).ave?"Nacimiento":"Parto"} estimado: <b>${fmt(fp)}</b>.`:""}</p></div>`:`<h2>Lugar de parto</h2>`}
  <div class="card stack" style="gap:8px;padding:12px"><div class="eyebrow">Requisitos para ${esc(espDe(a).nombre.toLowerCase())}</div>${reqResumen(a)}</div>
  <div class="grid2">
    ${fld("alojamiento","Dónde va a parir",sel("alojamiento",cfg.alo.map(x=>x.n),prev.alojamiento||cfg.alo[0].n))}
    ${fld("lugar","Nombre del lugar",inp("lugar",prev.lugar||"","text",'placeholder="Paridera 3, box 2, potrero del bajo…"'))}
    <div class="field" data-med><label for="largo">Largo (m)</label>${inp("largo",prev.largo??"","number",'min="0" step="any" inputmode="decimal"')}</div>
    <div class="field" data-med><label for="ancho">Ancho (m)</label>${inp("ancho",prev.ancho??"","number",'min="0" step="any" inputmode="decimal"')}</div>
    ${cfg.tAmb?fld("tAmb","Temperatura del ambiente medida (°C)",inp("tAmb",prev.tAmb??"","number",'step="any" inputmode="decimal"'),"","Opcional"):""}
    ${cfg.tCria?.min?fld("tCria","Temperatura en la zona de crías (°C)",inp("tCria",prev.tCria??"","number",'step="any" inputmode="decimal"'),"","Opcional, medila con la fuente de calor encendida"):""}
  </div>
  <div class="stack" style="gap:6px"><div class="eyebrow">Verificá en el lugar</div><div class="checklist">${cfg.items.map((it,i)=>`<label class="${it.c?"imp":""}"><input type="checkbox" name="chk" value="${i}" ${chk.has(i)?"checked":""}><span>${it.c?'<span class="req">Imprescindible</span>':""}${esc(it.t)}</span></label>`).join("")}</div></div>
  <div id="veredicto"></div>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-close>Después</button><button class="btn primary">Guardar revisión</button></div></form>`);
  const leer=()=>{const fd=new FormData($("#fMat")); const L=num(fd.get("largo")),W=num(fd.get("ancho"));
    return {fecha:hoy(),alojamiento:fd.get("alojamiento"),lugar:(fd.get("lugar")||"").trim(),largo:L,ancho:W,m2:L!=null&&W!=null?+(L*W).toFixed(2):null,tAmb:num(fd.get("tAmb")),tCria:num(fd.get("tCria")),checks:fd.getAll("chk").map(Number)}};
  const upd=()=>{const e=leer(), alo=cfg.alo.find(x=>x.n===e.alojamiento);
    document.querySelectorAll("#fMat [data-med]").forEach(w=>w.hidden=alo.m2==null&&!alo.porCria);
    const ev=evalMat({...a,maternidad:e,repro:(a.repro||[]).filter(r=>!(r.tipo==="paricion"&&r.fecha>=e.fecha))});
    $("#veredicto").innerHTML= ev.ok?`<div class="veredicto good">Apto para el parto${e.m2!=null?` · ${r1(e.m2,2)} m²`:""}${ev.pend?` · ${ev.pend} recomendaciones sin marcar`:""}</div>`
      :`<div class="veredicto bad">No apto todavía (${ev.faltas.length} ${ev.faltas.length>1?"puntos":"punto"})${e.m2!=null&&ev.min?` · ${r1(e.m2,2)} de ${r1(ev.min,2)} m²`:ev.min?` · se necesitan ${r1(ev.min,2)} m²${ev.crias?` para ~${ev.crias} crías`:""}`:""}</div>`;};
  $("#fMat").addEventListener("input",upd); $("#fMat").addEventListener("change",upd); upd();
  $("#fMat").onsubmit=e=>{e.preventDefault(); const m=leer(); closeSheet(); save({...animals[a.id],maternidad:m});
    const ev=evalMat({...animals[a.id],maternidad:m}); toast(ev.ok?"Lugar de parto apto":"Guardado: el lugar todavía no es apto");};
}
function camposRepro(a){

  return `
  <p class="small muted full" id="agGest" data-for="paricion aborto" hidden style="margin:0"></p>
  ${w("tacto",`<label for="resultado">Resultado</label>`+sel("resultado",["preñada","vacía","dudosa"]))}
  ${w("tacto",n("meses","Meses de preñez",'min="0" max="12" step="0.5"'))}
  ${w("paricion",n("totales",lit?"Nacidos totales":"Crías nacidas"))}
  ${w("paricion",n("vivos","Nacidos vivos"))}
  ${lit?w("paricion",n("momificados","Momificados")):""}
  ${w("paricion",n("machos","Machos"))}
  ${w("paricion",n("hembras","Hembras"))}
  ${w("paricion",n("pesoProm",`Peso promedio al nacer (${u})`,'min="0" step="any" inputmode="decimal"'))}
  ${lit?w("paricion",n("pesoCamada","Peso total de la camada (kg)",'min="0" step="any" inputmode="decimal"')):""}
  ${w("paricion",`<label for="tipoParto">Parto</label>`+sel("tipoParto",["Normal","Asistido (ayuda leve)","Distócico (ayuda fuerte)","Cesárea"]))}
  ${w("paricion",`<label for="habilidad">Habilidad materna</label>`+sel("habilidad",[["","Sin evaluar"],["5","5 · Excelente: amamanta, cuida, tranquila"],["4","4 · Buena"],["3","3 · Normal"],["2","2 · Floja: poca leche o descuida"],["1","1 · Mala: rechaza, pisa o agrede"]]))}
  ${w("paricion",`<label for="calostro">¿Tomaron calostro en las primeras horas?</label>`+sel("calostro",[["","Sin dato"],["si","Sí"],["no","No o tarde"]]))}
  ${lit?w("paricion",n("transfer","Crías adoptadas (+) o cedidas (−)",'step="1" inputmode="numeric"')):""}
  ${w("paricion",`<label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" name="crearCrias" value="1" checked style="width:auto">Crear ${lit?"la ficha de la camada":"las fichas de las crías"} para seguirlas</label>`,true)}
  ${w("destete",n("destetados","Crías destetadas"))}
  ${w("destete",n("pesoPromD",`Peso promedio al destete (${u})`,'min="0" step="any" inputmode="decimal"'))}
  ${lit?w("destete",n("pesoCamadaD","Peso total destetado (kg)",'min="0" step="any" inputmode="decimal"')):""}
  ${w("baja_cria",n("cantidadB","Cantidad"))}
  ${w("baja_cria",`<label for="causa">Causa</label>`+sel("causa",CAUSAS))}
  ${w("baja_cria",n("edadCria","Días de vida"))}
  ${w("aborto",`<label for="mesGest">Momento de la gestación</label>${inp("mesGest","","text",'placeholder="Ej.: 5 meses, tercer tercio"')}`)}
  ${w("postura incubacion",n("huevos","Cantidad de huevos"))}
  ${w("eclosion",n("huevosE","Huevos incubados"))}
  ${w("eclosion",n("nacidos","Nacidos"))}`;
}
function crearCrias(m,p){
  const esp=espDe(m), lit=LITERA.has(m.especie), par=["Bovino","Bubalino","Ovino","Caprino","Equino"].includes(m.especie);
  const serv=[...sortF(m.repro)].reverse().find(r=>r.tipo==="servicio"&&r.fecha<p.fecha);
  const base={especie:m.especie,raza:m.raza||"",madre:m.caravana||"",madreId:m.id,padre:serv?.detalle||"",fechaNac:p.fecha,origen:"Nacido en el campo",lote:m.lote||"",estado:"activo",pesoObjetivo:esp.obj,fotos:[],sanidad:[],repro:[],notas:[],creado:hoy()};
  const peso=num(p.pesoProm)??(num(p.pesoCamada)&&p.vivos?+(p.pesoCamada/p.vivos).toFixed(3):null);
  let nuevos=[];
  if(lit || p.vivos>4) nuevos=[{...base,id:uid(),caravana:(m.caravana?m.caravana+"-":"")+"C"+fmt(p.fecha).replace(/\//g,""),nombre:"Camada de "+(m.caravana||m.nombre||"madre"),cantidad:p.vivos,categoria:esp.cats[0],pesadas:peso!=null?[{fecha:p.fecha,kg:peso}]:[]}];
  else { let mach=+p.machos||0, hem=+p.hembras||0;
    for(let i=0;i<p.vivos;i++){ const sx=mach>0?(mach--,"M"):hem>0?(hem--,"H"):""; nuevos.push({...base,id:uid(),caravana:"",nombre:`Cría ${i+1} de ${m.caravana||m.nombre||"madre"}`,cantidad:1,sexo:sx,categoria:par?(sx==="H"?esp.cats[1]:esp.cats[0]):esp.cats[0],pesadas:peso!=null?[{fecha:p.fecha,kg:peso}]:[]}) } }
  for(const c of nuevos) save(c);
  toast(`Parto guardado y ${nuevos.length>1?nuevos.length+" fichas de crías creadas":"ficha de cría creada"}`);
}

async function agregarFirmas(id,blob,tipo,fotoId){
  try{ const fs=await window.__local.firmas(blob); const a=animals[id]; if(!a) return;
    const nuevas=fs.map(f=>({...f,t:tipo,f:fotoId}));
    let todas=[...(a.firmas||[]),...nuevas];
    const aprendidas=todas.filter(x=>x.t==="Confirmada"); if(aprendidas.length>12) todas=todas.filter(x=>x!==aprendidas[0]&&x!==aprendidas[1]);
    save({...a,firmas:todas});
  }catch(e){ console.warn("firmas",e) }
}
function aprender(id){
  const q=S.id.res?.firmaConsulta, a=animals[id]; if(!q||!a) return;
  let todas=[...(a.firmas||[]),...q.map(f=>({...f,t:"Confirmada",f:null,d:hoy()}))];
  const ap=todas.filter(x=>x.t==="Confirmada"); if(ap.length>12) todas=todas.filter(x=>x!==ap[0]&&x!==ap[1]);
  save({...a,firmas:todas}); S.id.res.firmaConsulta=null; toast("Anotado: la próxima vez lo reconoce mejor");
}
let backfillHecho=false;
async function completarFirmas(){
  if(backfillHecho||!window.__local) return; backfillHecho=true;
  for(const a of Object.values(animals)){
    if(window.__local.conModelo() && (a.firmas||[]).some(f=>f.f&&f.e==null)){ const ids=new Set(a.firmas.filter(f=>f.f&&f.e==null).map(f=>f.f)); save({...a,firmas:a.firmas.filter(f=>!ids.has(f.f))}); }
    const tiene=new Set((animals[a.id]?.firmas||[]).map(f=>f.f));
    for(const f of (a.fotos||[])){ if(tiene.has(f.id)) continue;
      try{ const b=await fetch(photoUrl(f.id)).then(r=>r.blob()); await agregarFirmas(a.id,b,f.tipo,f.id) }catch{} }
  }
}
async function subirFoto(id,blob,tipo){
  if(!assets){toast("No tenés permiso para subir fotos");return}
  toast("Subiendo foto…");
  try{const r=await assets.upload(blob,{type:blob.type&&/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:"image/jpeg"});
    const a=animals[id]; if(!a)return; save({...a,fotos:[...(a.fotos||[]),{id:r.id,tipo,fecha:hoy()}]}); toast("Foto guardada");
    if(window.__local) agregarFirmas(id,blob,tipo,r.id);
  }catch(e){toast(e?.code==="too_large"?"La foto es muy pesada":e?.code==="unsupported_type"?"Formato no admitido, usá JPG o PNG":"No se pudo subir la foto")}
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) { if(e.target.id==="sheetBg") closeSheet(); return }
  if(t.dataset.esp!==undefined){ S.esp=t.dataset.esp; guardarEsp(S.esp); if(S.view==="ficha") S.view="rodeo"; render(); return }
  if(t.dataset.go){ if(t.dataset.go==="nuevo"){S.prefill=null;formAnimal();return} S.view=t.dataset.go; S.confirmDel=null; render(); window.scrollTo(0,0); return }
  if(t.dataset.open && t.dataset.confirm && window.__local) aprender(t.dataset.open);
  if(t.dataset.open){ S.view="ficha"; S.sel=t.dataset.open; S.confirmDel=null; if(t.dataset.tab) S.fichaTab=t.dataset.tab==="faena"?"pesadas":t.dataset.tab==="mat"?"repro":t.dataset.tab; render(); window.scrollTo(0,0); return }
  if(t.dataset.modo){ S.modo=t.dataset.modo; render(); return }
  if(t.dataset.ftab){ S.fichaTab=t.dataset.ftab; render(); return }
  if(t.dataset.add){ S.preTipo=t.dataset.pre||null; formEvento(t.dataset.add); return }
  if(t.dataset.close!==undefined){ closeSheet(); return }
  if(t.dataset.rm){ const [k,i]=t.dataset.rm.split(":"); const a=animals[S.sel]; const arr=[...(a[k]||[])]; const [quit]=arr.splice(+i,1); const extra=k==="fotos"&&quit?{firmas:(a.firmas||[]).filter(f=>f.f!==quit.id)}:{}; save({...a,[k]:arr,...extra}); return }
  switch(t.id){
    case "btnAnalizar": identificar(); break;
    case "btnLimpiar": S.id={file:null,blob:null,url:null,res:null,busy:false,cmp:null,err:""}; render(); break;
    case "btnComparar": comparar(); break;
    case "btnOtroBurro": S.id.burro=null; render(); break;
    case "btnNoPersona": S.id.sinPersona=true; identificar(); break;
    case "btnLimpiar2": S.id={file:null,blob:null,url:null,res:null,busy:false,cmp:null,err:""}; render(); window.scrollTo(0,0); break;
    case "btnNuevoDesdeFoto": { const r=S.id.res||{}; const esp=ESPECIES[r.especie]?r.especie:(S.esp||"Bovino");
      S.prefill={especie:esp,raza:r.raza_probable||"",sexo:r.sexo_probable==="H"||r.sexo_probable==="M"?r.sexo_probable:"",categoria:ESPECIES[esp].cats.find(c=>c.toLowerCase()===String(r.categoria_probable||"").toLowerCase())||"",pelaje:r.pelaje||"",senas:r.senas_visibles||"",caravana:r.caravana_leida||"",estado:"activo",blob:S.id.blob};
      formAnimal(); break; }
    case "btnEditar": formAnimal(animals[S.sel]); break;
    case "btnDieta": formDieta(); break;
    case "btnExport": window.__web.exportar().then(()=>toast("Copia descargada")).catch(()=>toast("No se pudo exportar")); break;
    case "btnMat": { const a=animals[S.sel]; formMaternidad(a, necesitaMat(a,estado(a)) && !evalMat(a).ok); break; }
    case "btnFoto": case "btnFoto2": formFoto(); break;
    case "btnBorrar": if(S.confirmDel===S.sel){S.confirmDel=null;removeAnimal(S.sel)} else {S.confirmDel=S.sel;render()} break;
    case "btnBorrarEj": Object.values(animals).filter(a=>a.ejemplo).forEach(a=>removeAnimal(a.id)); S.view="rodeo"; render(); break;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="camIn"||t.id==="galIn"){ const f=t.files[0]; if(!f)return; const b=await shrink(f);
    if(S.id.url) URL.revokeObjectURL(S.id.url);
    S.id={file:f,blob:b,url:URL.createObjectURL(b),res:null,busy:false,cmp:null,err:""}; render(); }
  if(t.id==="impIn" && t.files[0]){ window.__web.importar(t.files[0]).then(n=>{toast(`Importados ${n} registros`)}).catch(()=>toast("El archivo no es una copia válida")) }
  if(t.id==="fEsp"){S.fEsp=t.value;render()}
  if(t.id==="fEst"){S.fEst=t.value;render()}
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){S.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos)} });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet() });
document.addEventListener("submit",e=>{ if(e.target.id==="fCodigo"){ e.preventDefault(); const v=$("#codigoIn").value.trim(); if(v){ window.__web.setCodigo(v); toast("Código guardado"); render() } } });

/* ---------- arranque ---------- */
render();
(async()=>{
  const C=window.claude;
  const [d,as,sm]=await Promise.all([C?.use?.("db"),C?.use?.("assets"),C?.use?.("sample")].map(p=>Promise.resolve(p).catch(()=>null)));
  db=d; assets=as; sample=sm;
  if(sample){ const lim=await sample.limits().catch(()=>null); imgOK=!!lim?.images }
  ready=true;
  if(db){ col=db.collection("animales");
    col.onSnapshot(snap=>{ const next={}; for(const doc of snap.docs) next[doc.id]={...doc.data(),id:doc.id}; animals=next; render(); if(window.__local) setTimeout(completarFirmas,3000) },
      ()=>toast("Se perdió la conexión con el rodeo; recargá la página"));
  } else render();
})();
</script>
